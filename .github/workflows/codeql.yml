name: CodeQL

# Replaces GitHub's default CodeQL setup so each language is only analysed when a change touches it. The weekly
# run and manual runs analyse everything.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.diff.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all='["actions","javascript-typescript","rust"]'
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] \
            || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA"); then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          langs=()
          grep -qE '^\.github/' <<< "$files" && langs+=('"actions"')
          grep -qE '\.(c|m)?(j|t)sx?$|(^|/)package\.json$|^pnpm-lock\.yaml$' <<< "$files" && langs+=('"javascript-typescript"')
          grep -qE '^apps/desktop/src-tauri/' <<< "$files" && langs+=('"rust"')
          echo "languages=[$(IFS=,; echo "${langs[*]}")]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
