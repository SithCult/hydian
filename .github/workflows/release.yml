name: Release

# Compile without signing credentials, then sign approved releases and publish only after verification.
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - pnpm-lock.yaml
      - scripts/bundle-release.mjs
      - scripts/sign-windows.ps1
      - .github/workflows/release.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'Release v')
    uses: ./.github/workflows/checks.yml

  version:
    name: version and tag
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: v${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Decide the bump
        id: kind
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          kind="$INPUT_BUMP"
          if [ -z "$kind" ]; then
            last=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)
            if [ -n "$last" ]; then range="$last..HEAD"; else range=""; fi
            if git log --format=%s $range | grep -qiE "^(feat|minor)(\(|:)"; then kind=minor; else kind=patch; fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - name: Bump, commit, tag
        id: bump
        env:
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          v=$(node scripts/bump.mjs "$KIND")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock
          git commit -m "Release v$v"
          git tag -a "v$v" -m "Hydian $v"
          git push origin HEAD:main "v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: compile ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix: &platforms
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: hydian.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            binary: hydian
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            binary: hydian
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Compile without signing credentials
        run: pnpm -F @hydian/desktop tauri build --ci --target ${{ matrix.target }} --no-bundle
      - name: Preserve executable permissions
        shell: bash
        run: tar -czf compiled.tar.gz -C apps/desktop dist src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-${{ matrix.target }}
          path: compiled.tar.gz
          retention-days: 7
          if-no-files-found: error

  sign:
    name: sign and verify ${{ matrix.name }}
    needs: [version, build]
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    strategy:
      fail-fast: false
      # tauri-action merges the shared updater manifest; uploads must be sequential.
      max-parallel: 1
      matrix: *platforms
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compiled-${{ matrix.target }}
      - name: Restore compiled app
        shell: bash
        run: tar -xzf compiled.tar.gz -C apps/desktop
      - name: Require signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          required=(TAURI_SIGNING_PRIVATE_KEY)
          if [ "$RUNNER_OS" = macOS ]; then
            required+=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY APPLE_TEAM_ID)
            [[ "$APPLE_SIGNING_IDENTITY" == 'Developer ID Application: '* ]] || { echo 'Developer ID Application signing is required.' >&2; exit 1; }
          fi
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || { echo "Missing release secret: $name" >&2; exit 1; }
          done
          if [ "$RUNNER_OS" = macOS ]; then
            umask 077
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          fi
      - name: Require Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          foreach ($name in 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'WINDOWS_SIGNING_SUBJECT') {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing release secret: $name" }
          }
      - name: Install Windows signing tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.8 -Force -Repository PSGallery -Scope CurrentUser
      - name: Sign in to Azure with short-lived credentials
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bundle and upload draft assets
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ runner.os == 'macOS' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_SIGNING_ENDPOINT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ runner.os == 'Windows' && secrets.AZURE_SIGNING_PROFILE || '' }}
          WINDOWS_SIGNING_SUBJECT: ${{ runner.os == 'Windows' && secrets.WINDOWS_SIGNING_SUBJECT || '' }}
        with:
          projectPath: apps/desktop
          tauriScript: node ../../scripts/bundle-release.mjs
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          includeUpdaterJson: true
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Hydian ${{ needs.version.outputs.tag }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            Download installers and release information at https://hydian.org/download.
            Installed copies update themselves.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          bundle=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          app="$bundle/macos/Hydian.app"
          codesign --verify --deep --strict "$app"
          team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [ "$team" = "$APPLE_TEAM_ID" ] || { echo 'Unexpected Apple signing team.' >&2; exit 1; }
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          for dmg in "$bundle"/dmg/*.dmg; do codesign --verify --strict "$dmg"; done
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          if (!$env:WINDOWS_SIGNING_SUBJECT) { throw 'Configure the Windows signing provider and WINDOWS_SIGNING_SUBJECT before releasing.' }
          $root = 'apps/desktop/src-tauri/target/${{ matrix.target }}/release'
          # The signing hook verifies each packaged executable; Tauri then restores the unsigned build file.
          $files = @(Get-ChildItem "$root/bundle/nsis/*-setup.exe")
          if ($files.Count -ne 1) { throw 'Expected one Windows installer.' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or $signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNING_SUBJECT) {
              throw "Invalid, untimestamped or unexpected publisher signature: $($file.Name)"
            }
          }
      - name: Remove Apple notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: publish verified downloads
    needs: [version, sign]
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
