name: Release

# Every change to the app on main becomes a release: the version is bumped (patch, or minor when a commit
# since the last release says `feat:` or `minor:`), a tag is cut, the three installers are built and
# published, and the download bucket behind dl.hydian.org gets the new files. The website and the API have
# their own workflows and do not trigger this. Run it by hand with a bump kind to force one.
on:
  push:
    branches: [main]
    paths: ["apps/desktop/**", "pnpm-lock.yaml", ".github/workflows/release.yml", ".github/workflows/publish.yml"]
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor or major
        default: patch
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- bump + tag
  version:
    name: version and tag
    # the release commit itself must not start another release
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: v${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decide the bump
        id: kind
        env:
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          kind="$INPUT_BUMP"
          if [ -z "$kind" ]; then
            last=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)
            if [ -n "$last" ]; then range="$last..HEAD"; else range=""; fi
            if git log --format=%s $range | grep -qiE "^(feat|minor)(\(|:)"; then kind=minor; else kind=patch; fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
      - name: Bump, commit, tag
        id: bump
        env:
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          v=$(node scripts/bump.mjs "$KIND")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v$v"
          git tag -a "v$v" -m "Hydian $v"
          git push origin HEAD:main "v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- installers, one release
  build:
    name: ${{ matrix.name }}
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater artifacts (*.sig, latest.json) are signed with the project key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: signed and notarised when the Developer ID secrets exist, ad-hoc signed until then
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          includeUpdaterJson: true
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Hydian ${{ needs.version.outputs.version }}
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Downloads

            [hydian.org/download](https://hydian.org/download) has the installers for Windows and macOS.
            Installed copies update themselves.

            | Platform | File |
            |---|---|
            | Windows 10/11 | `Hydian_*_x64-setup.exe` |
            | macOS, Apple Silicon | `Hydian_*_aarch64.dmg` |
            | macOS, Intel | `Hydian_*_x64.dmg` |

  # ---------------------------------------------------------------- dl.hydian.org
  publish:
    name: publish downloads
    needs: [version, build]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
