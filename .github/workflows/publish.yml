name: Publish downloads

# Called only after all release targets pass signature verification. Retry failed jobs in Release to republish.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true

env:
  BUCKET: hydian-downloads

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install updater signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag.' >&2; exit 1; }
          mkdir -p out/latest "out/$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          jq -r '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json | base64 --decode > updater.pub
          jq -e --arg version "${TAG#v}" --arg prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" '
            .version == $version and
            (.platforms | has("windows-x86_64") and has("darwin-aarch64") and has("darwin-x86_64")) and
            all(.platforms[]; (.signature | type == "string") and (.signature | length > 0) and (.url | startswith($prefix)))
          ' assets/latest.json > /dev/null
          while IFS= read -r url; do
            file=${url##*/}
            test -s "assets/$file"
            test -s "assets/$file.sig"
            jq -e --arg url "$url" --arg signature "$(tr -d '\r\n' < "assets/$file.sig")" \
              'all(.platforms[] | select(.url == $url); .signature == $signature)' assets/latest.json > /dev/null
            base64 --decode < "assets/$file.sig" > updater.sig
            minisign -Vm "assets/$file" -p updater.pub -x updater.sig -q
          done < <(jq -r '.platforms[].url' assets/latest.json | sort -u)
          cp assets/*_x64-setup.exe out/latest/Hydian-Setup.exe
          cp assets/*_aarch64.dmg   out/latest/Hydian-AppleSilicon.dmg
          cp assets/*_x64.dmg       out/latest/Hydian-Intel.dmg
          cp out/latest/* "out/$TAG/"
          # updater artefacts keep their names; latest.json points at the bucket instead of GitHub
          cp assets/*.sig assets/*.tar.gz "out/$TAG/"
          cp assets/*_x64-setup.exe "out/$TAG/"
          sed "s#https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/#https://dl.hydian.org/$TAG/#g" \
            assets/latest.json > out/latest/latest.json
          size() { stat -c %s "$1"; }
          DATE=$(date -u +%Y-%m-%d)
          cat > out/latest/releases.json <<EOF
          {
            "version": "${TAG#v}",
            "tag": "$TAG",
            "date": "$DATE",
            "notes": "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG",
            "files": {
              "windows":      { "path": "latest/Hydian-Setup.exe",        "size": $(size out/latest/Hydian-Setup.exe) },
              "macArm":       { "path": "latest/Hydian-AppleSilicon.dmg", "size": $(size out/latest/Hydian-AppleSilicon.dmg) },
              "macIntel":     { "path": "latest/Hydian-Intel.dmg",        "size": $(size out/latest/Hydian-Intel.dmg) }
            }
          }
          EOF
          cat out/latest/releases.json

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # versioned copies never change
          aws s3 cp "out/$TAG" "s3://$BUCKET/$TAG" --recursive --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=31536000, immutable"
          # latest/ is what the website links; short cache so a new release shows up within minutes
          aws s3 cp out/latest "s3://$BUCKET/latest" --recursive --endpoint-url "$ENDPOINT" \
            --cache-control "public, max-age=300" --exclude "*.json"
          for f in releases.json latest.json; do
            aws s3 cp "out/latest/$f" "s3://$BUCKET/latest/$f" --endpoint-url "$ENDPOINT" \
              --cache-control "public, max-age=300" --content-type "application/json"
          done
