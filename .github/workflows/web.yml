name: Website

# hydian.org: the static export of apps/web, published to Cloudflare Pages (project "hydian") on every push to main.
# Needs CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. Without them the job is skipped, not failed.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.WEB_DEPLOY != 'off' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @hydian/web build
        env:
          NEXT_PUBLIC_API: https://api.hydian.org
          NEXT_PUBLIC_TILES: https://tiles.hydian.org/
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy apps/web/out --project-name=hydian --branch=main --commit-dirty=true
