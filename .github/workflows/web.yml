name: Website

# hydian.org: the static export of apps/web, published to Cloudflare Pages (project "hydian") on every push to main.
# Publishing credentials belong to the main-only website environment.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.WEB_DEPLOY != 'off'
    environment: website
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @hydian/web build
        env:
          NEXT_PUBLIC_API: https://api.hydian.org
          NEXT_PUBLIC_TILES: https://tiles.hydian.org/
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing website environment credentials.' >&2; exit 1; }
          pnpm exec wrangler pages deploy apps/web/out --project-name=hydian --branch=main --commit-dirty=true
