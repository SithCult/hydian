name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- web side: types, lint, format, bundles
  check:
    name: typecheck · lint · tests · build
    uses: ./.github/workflows/checks.yml

  # ---------------------------------------------------------------- the app: every platform, every push
  desktop:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            ext: exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            ext: dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            ext: dmg
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile

      - name: rustfmt
        run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - name: clippy (warnings are errors)
        run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
        working-directory: apps/desktop/src-tauri

      - name: Native regression tests
        run: cargo test --locked --target ${{ matrix.target }}
        working-directory: apps/desktop/src-tauri

      - name: Build the installer
        # plain installers: updater artifacts (and the signing key) are only needed by the release workflow
        shell: bash
        run: >
          pnpm -F @hydian/desktop tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*.${{ matrix.ext }}" -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydian-${{ matrix.target }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

      - name: Report sizes
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo "| Installer | Size |"
            echo "|---|---|"
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
            bin=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release -maxdepth 1 -type f \( -name hydian -o -name hydian.exe \) | head -1)
            [ -n "$bin" ] && echo "| binary $(basename "$bin") | $(du -h "$bin" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
