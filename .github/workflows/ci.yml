name: CI secret boundary probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-pr:
    name: Ordinary PR job runs without a production environment
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Untrusted PR jobs can run without production environments.'

  protected-release:
    name: PR must be denied release environment
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Fail if a protected job is allowed to start
        run: |
          echo '::error::A PR job was allowed to start in the protected release environment.'
          exit 1

  protected-website:
    name: PR must be denied website environment
    runs-on: ubuntu-latest
    environment: website
    steps:
      - name: Fail if a protected job is allowed to start
        run: |
          echo '::error::A PR job was allowed to start in the protected website environment.'
          exit 1

  protected-downloads:
    name: PR must be denied downloads environment
    runs-on: ubuntu-latest
    environment: downloads
    steps:
      - name: Fail if a protected job is allowed to start
        run: |
          echo '::error::A PR job was allowed to start in the protected downloads environment.'
          exit 1
